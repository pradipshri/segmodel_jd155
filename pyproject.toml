[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pradipshri-segmodel_jd155"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出图像分割研究员·成本与吞吐的帕累托边界上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pradipshri" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pradipshri.github.io"
Repository = "https://github.com/pradipshri/segmodel_jd155"
Issues = "https://github.com/pradipshri/segmodel_jd155/issues"

[project.scripts]
segmodel_jd155 = "segmodel_jd155:main"

[tool.setuptools]
py-modules = ["segmodel_jd155"]
